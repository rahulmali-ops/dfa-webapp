<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="dfa-pdf-layout" content="v4-score-formula-ascii">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">

    <title>DFA Report - Comprehensive View</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(145deg, #083B37 0%, #147A72 55%, #1A9B8E 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .controls-header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .controls-left {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .dfa-id-display {
            background: linear-gradient(145deg, #083B37 0%, #147A72 55%, #1A9B8E 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .controls-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-back {
            background: #6c757d;
            color: white;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        .btn-edit {
            background: #147A72;
            color: white;
        }

        .btn-edit:hover {
            background: #0F6660;
        }

        .btn-edit.active {
            background: #ff9800;
        }

        .btn-save {
            background: #1B7A4E;
            color: white;
        }

        .btn-save:hover {
            background: #166B44;
        }

        .btn-pdf {
            background: #e74c3c;
            color: white;
        }

        .btn-pdf:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-json {
            background: #147A72;
            color: white;
        }

        .btn-json:hover {
            background: #0B4F4A;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .edit-mode-indicator {
            background: #ff9800;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
        }

        .edit-mode-indicator.active {
            display: inline-block;
        }

        .report-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        #reportContent {
            padding: 50px;
        }

        .report-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 3px solid #147A72;
        }

        .report-title {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }

        .report-subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 5px;
        }

        .report-id {
            font-size: 1.1rem;
            color: #147A72;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .report-date {
            font-size: 0.95rem;
            color: #999;
        }

        .dfa-score-badge {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: bold;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .score-excellent {
            background: linear-gradient(145deg, #1B7A4E 0%, #2D9B6A 100%);
            color: white;
        }

        .score-good {
            background: linear-gradient(145deg, #0B4F4A 0%, #1A9B8E 100%);
            color: white;
        }

        .score-average {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            color: white;
        }

        .score-poor {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
        }

        .score-breakdown {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            border: 2px solid #e0e0e0;
        }

        .score-breakdown h3 {
            color: #147A72;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #147A72;
        }

        .score-label {
            font-weight: 600;
            color: #333;
        }

        .score-value {
            font-weight: bold;
            color: #147A72;
        }

        .report-section {
            margin-bottom: 35px;
            page-break-inside: avoid;
        }

        .section-title {
            font-size: 1.8rem;
            color: #147A72;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 1.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #147A72;
        }

        .info-item.editable {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .info-item.editable:hover {
            background: #e8f4f8;
            transform: translateX(5px);
        }

        .info-label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.1rem;
            color: #333;
            font-weight: 500;
        }

        .info-value.empty {
            color: #999;
            font-style: italic;
        }

        .info-value input,
        .info-value textarea {
            width: 100%;
            padding: 8px;
            border: 2px solid #147A72;
            border-radius: 5px;
            font-size: 1rem;
            font-family: inherit;
        }

        .milestone-badge {
            display: inline-block;
            background: #1B7A4E;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .pfd-flow-container {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
            overflow-x: auto;
        }

        .pfd-flow {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: flex-start;
            min-width: min-content;
        }

        .pfd-step {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            width: 220px;
        }

        .pfd-step-text {
            padding: 10px;
            font-size: 0.9rem;
            background: #f5f5f5;
            border: 1px solid #999;
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-wrap: break-word;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .pfd-step-image {
            border: 1px solid #999;
            border-radius: 4px;
            overflow: hidden;
            background: #f0f0f0;
            width: 220px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pfd-step-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .pfd-arrow {
            flex: 0 0 auto;
            width: 36px;
            height: 36px;
            margin: 0 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 0;
        }

        .pfd-arrow::before {
            content: '';
            width: 18px;
            height: 2px;
            background: #147A72;
            border-radius: 2px;
        }

        .pfd-arrow::after {
            content: '';
            position: absolute;
            right: 6px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 8px solid #147A72;
        }

        .amr-step-card {
            background: #f8f9fa;
            border: 2px solid #147A72;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            page-break-inside: avoid;
        }

        .amr-step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #147A72;
        }

        .amr-step-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .amr-section-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .amr-section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #147A72;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .amr-requirement-item {
            background: #f8f9fa;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 3px solid #147A72;
        }

        .amr-requirement-id {
            font-weight: bold;
            color: #147A72;
            font-size: 0.9rem;
        }

        .amr-requirement-text {
            color: #555;
            font-size: 0.85rem;
            margin-top: 3px;
        }

        .facility-section-card {
            background: #f8f9fa;
            border: 2px solid #0B4F4A;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            page-break-inside: avoid;
        }

        .facility-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #0B4F4A;
        }

        .facility-section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #083B37;
        }

        .facility-section-stats {
            background: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #0B4F4A;
            font-weight: 600;
        }

        .facility-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .facility-stat-card {
            background: linear-gradient(145deg, #083B37 0%, #147A72 55%, #1A9B8E 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .facility-stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .facility-stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .facility-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .facility-table thead {
            background: linear-gradient(145deg, #0B4F4A 0%, #147A72 100%);
            color: white;
        }

        .facility-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .facility-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.85rem;
        }

        .facility-table tbody tr:hover {
            background: #f8f9fa;
        }

        .facility-table tbody tr:last-child td {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #666;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #147A72;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1B7A4E;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(145deg, #083B37 0%, #147A72 55%, #1A9B8E 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
            gap: 20px;
        }

        .progress-overlay.active {
            display: flex;
        }

        .progress-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            min-width: 300px;
        }

        .progress-bar-container {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(145deg, #083B37 0%, #147A72 55%, #1A9B8E 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .progress-text {
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            #reportContent {
                padding: 30px 20px;
            }

            .report-title {
                font-size: 1.8rem;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .controls-header {
                flex-direction: column;
                align-items: stretch;
            }

            .controls-left,
            .controls-right {
                width: 100%;
                justify-content: center;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        // ============================================
        // DFA SCORE CALCULATION
        // ============================================
















        function resolveAmrId(amr) {
            if (amr == null) return null;
            if (typeof amr === 'string') {
                const m = amr.match(/(AMR_[A-Z]+_\d+)/);
                return m ? m[1] : amr.trim();
            }
            if (typeof amr === 'object') {
                if (amr.id) return resolveAmrId(String(amr.id));
                if (amr.amrId) return resolveAmrId(String(amr.amrId));
            }
            return String(amr);
        }

        function getAMRDetails(amrId) {
            const id = resolveAmrId(amrId);
            const info = id ? AMR_REQUIREMENTS_DATABASE[id] : null;
            if (info && typeof info === 'object') {
                return {
                    id: info.id || id,
                    requirement: info.requirement || id,
                    category: info.category || '',
                    priority: Number(info.priority) || 0,
                    weightage: Number(info.weightage) || 0
                };
            }
            return {
                id: id || String(amrId || ''),
                requirement: id || String(amrId || ''),
                category: '',
                priority: 0,
                weightage: 0
            };
        }

        function getCatalogApplicableTotals() {
            let total = 0, p5 = 0, p3 = 0, count = 0;
            Object.keys(AMR_REQUIREMENTS_DATABASE).forEach(function(key) {
                const info = AMR_REQUIREMENTS_DATABASE[key];
                if (!info || typeof info !== 'object') return;
                const pr = Number(info.priority) || 0;
                const wt = Number(info.weightage) || 0;
                if (!pr || !wt) return;
                const v = pr * wt;
                total += v;
                count += 1;
                if (pr === 5) p5 += v;
                else if (pr === 3) p3 += v;
            });
            return { total: total, p5: p5, p3: p3, count: count };
        }

        function calculateDFAScore(data) {
            // Penalties from AMR statuses: Fail = full P×W, Conditionally Passed = 0.5×P×W.
            // Applicable = full AMR catalog. Score = 100 - (∑ Penalties / ∑ Applicable × 100).
            if (!data.amr || !data.amr.steps || data.amr.steps.length === 0) {
                return null;
            }

            const catalog = getCatalogApplicableTotals();
            if (!catalog.total) return null;

            let totalPenalties = 0;
            let priority5Penalties = 0;
            let priority3Penalties = 0;
            let failedItems = [];
            let failCount = 0;
            let conditionalCount = 0;
            const seen = new Set();

            function penaltyFactor(status) {
                if (status === 'Fail') return 1;
                if (status === 'Conditionally Passed' || status === 'Partially Passed') return 0.5;
                return 0;
            }

            data.amr.steps.forEach(function(step) {
                const statuses = step.amrStatuses || {};
                const ids = step.allSelectedAMRs && step.allSelectedAMRs.length
                    ? step.allSelectedAMRs
                    : Object.keys(statuses);
                ids.forEach(function(raw) {
                    const amrId = resolveAmrId(raw);
                    if (!amrId || seen.has(amrId)) return;
                    const status = statuses[amrId] || statuses[raw];
                    // Legacy fallback: no statuses → treat selected as Fail
                    const factor = status != null ? penaltyFactor(status) : 1;
                    if (factor <= 0) return;
                    seen.add(amrId);
                    const amrInfo = getAMRDetails(amrId);
                    if (!amrInfo.priority || !amrInfo.weightage) return;
                    const ruleValue = amrInfo.priority * amrInfo.weightage * factor;
                    totalPenalties += ruleValue;
                    failCount += 1;
                    if (factor < 1) conditionalCount += 1;
                    failedItems.push(amrId);
                    if (amrInfo.priority === 5) priority5Penalties += ruleValue;
                    else if (amrInfo.priority === 3) priority3Penalties += ruleValue;
                });
            });

            const overallScore = 100 - ((totalPenalties / catalog.total) * 100);
            const priority5Score = catalog.p5 > 0 ? 100 - ((priority5Penalties / catalog.p5) * 100) : 100;
            const priority3Score = catalog.p3 > 0 ? 100 - ((priority3Penalties / catalog.p3) * 100) : 100;

            let rating, color;
            if (overallScore >= 90) { rating = 'Excellent'; color = 'score-excellent'; }
            else if (overallScore >= 75) { rating = 'Good'; color = 'score-good'; }
            else if (overallScore >= 60) { rating = 'Average'; color = 'score-average'; }
            else { rating = 'Needs Improvement'; color = 'score-poor'; }

            return {
                overall: overallScore,
                priority5: priority5Score,
                priority3: priority3Score,
                totalPenalties: Math.round(totalPenalties * 100) / 100,
                totalApplicable: catalog.total,
                priority5Penalties: priority5Penalties,
                priority5Applicable: catalog.p5,
                priority3Penalties: priority3Penalties,
                priority3Applicable: catalog.p3,
                failedItems: failedItems,
                applicableCount: catalog.count,
                failCount: failCount,
                conditionalCount: conditionalCount,
                rating: rating,
                color: color,
                formula: '100 - (Penalties / Applicable x 100); Fail=full, Conditionally Passed=half; Applicable = full AMR catalog'
            };

        function loadReportData() {
            const storedData = localStorage.getItem('currentDFA');
            
            if (!storedData) {
                displayEmptyState();
                return;
            }

            try {
                dfaData = JSON.parse(storedData);
                document.getElementById('dfaIdDisplay').textContent = `DFA ID: ${dfaData.dfaId}`;
                renderReport(dfaData);
            } catch (e) {
                console.error('Error loading DFA data:', e);
                displayEmptyState();
            }
        }

        async function renderReport(data) {
            const reportContent = document.getElementById('reportContent');
            
            if (!data || !data.selection || !data.selection.type) {
                displayEmptyState();
                return;
            }

            reportContent.innerHTML = '<div class="loading"><div class="spinner"></div><p>Rendering report...</p></div>';

            await new Promise(resolve => setTimeout(resolve, 100));

            const fragment = document.createDocumentFragment();
            
            fragment.appendChild(createReportHeader(data));
            fragment.appendChild(createSummaryStats(data));
            
            if (data.revup && Object.keys(data.revup).length > 0) {
                fragment.appendChild(createREVUPSection(data.revup));
            } else if (data.newdfa && Object.keys(data.newdfa).length > 0) {
                fragment.appendChild(createREVUPSection(data.newdfa, 'NEW DFA Information'));
            }
            
            if (data.pfd && Object.keys(data.pfd).length > 0) {
                fragment.appendChild(createPFDSection(data.pfd));
            }
            
            if (data.amr && data.amr.steps && data.amr.steps.length > 0) {
                fragment.appendChild(createAMRSection(data.amr));
            }
            
            if (data.facilityAnalysis && data.facilityAnalysis.length > 0) {
                fragment.appendChild(createFacilityAnalysisSection(data.facilityAnalysis));
            }

            // Score last (matches PDF order)
            fragment.appendChild(createScoreSection(data));
            
            reportContent.innerHTML = '';
            reportContent.appendChild(fragment);
        }

        function getImageFormat(dataUrl) {
            if (!dataUrl || typeof dataUrl !== 'string') return null;
            if (dataUrl.indexOf('data:image/png') === 0) return 'PNG';
            if (dataUrl.indexOf('data:image/webp') === 0) return 'WEBP';
            if (dataUrl.indexOf('data:image/jpeg') === 0 || dataUrl.indexOf('data:image/jpg') === 0) return 'JPEG';
            return 'JPEG';
        }

        function loadImageSize(dataUrl) {
            return new Promise((resolve) => {
                if (!dataUrl) { resolve(null); return; }
                const img = new Image();
                img.onload = () => resolve({ w: img.naturalWidth || img.width, h: img.naturalHeight || img.height });
                img.onerror = () => resolve(null);
                img.src = dataUrl;
            });
        }

        function fitImageToWidth(natW, natH, maxW, maxH) {
            if (!natW || !natH) return { w: maxW, h: Math.min(maxH, maxW * 0.75) };
            let w = maxW;
            let h = (natH / natW) * w;
            if (h > maxH) {
                h = maxH;
                w = (natW / natH) * h;
            }
            return { w, h };
        }

        async function generatePDF() {
            if (!dfaData) {
                alert('❌ No DFA data available');
                return;
            }

            const btn = (typeof event !== 'undefined' && event?.target)
                ? event.target.closest('button') || event.target
                : document.querySelector('.btn-pdf');
            const originalText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.innerHTML = '⏳ Generating PDF...';
                btn.disabled = true;
            }

            try {
                showProgress('Preparing clean A4 PDF...', 4);

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4', compress: true });

                // Professional A4 geometry
                const pageWidth = doc.internal.pageSize.getWidth();   // 210
                const pageHeight = doc.internal.pageSize.getHeight(); // 297
                const margin = 18;
                const footerSafe = 20;
                const contentWidth = pageWidth - margin * 2;
                let yPos = margin;

                const teal = [11, 79, 74];
                const tealMid = [20, 122, 114];
                const slate = [33, 45, 54];
                const muted = [92, 107, 122];
                const line = [211, 219, 227];
                const soft = [247, 249, 250];
                const white = [255, 255, 255];

                const tableEdge = { left: margin, right: margin, top: margin, bottom: footerSafe };

                const scoreData = calculateDFAScore(dfaData);
                const appType = (dfaData.selection?.type || '').toLowerCase();
                const detailSrc = (appType === 'newdfa' && dfaData.newdfa)
                    ? dfaData.newdfa
                    : (dfaData.revup || dfaData.newdfa || {});

                const ensureSpace = (needed) => {
                    if (yPos + needed > pageHeight - footerSafe) {
                        doc.addPage();
                        yPos = margin;
                    }
                };

                const drawSectionBanner = (title) => {
                    ensureSpace(18);
                    yPos += 4;
                    doc.setFillColor(...teal);
                    doc.roundedRect(margin, yPos, contentWidth, 9, 1.4, 1.4, 'F');
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(10);
                    doc.setTextColor(...white);
                    doc.text(String(title).toUpperCase(), margin + 4.5, yPos + 6);
                    doc.setTextColor(...slate);
                    yPos += 14;
                };

                const drawSubhead = (text) => {
                    ensureSpace(12);
                    yPos += 1;
                    doc.setFillColor(...soft);
                    doc.roundedRect(margin, yPos - 3.5, contentWidth, 8, 1, 1, 'F');
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(9);
                    doc.setTextColor(...tealMid);
                    doc.text(String(text), margin + 3, yPos + 1.5);
                    yPos += 8;
                    doc.setTextColor(...slate);
                };

                // Two-column label/value grid - neat & compact on A4
                const drawKvGrid = (pairs) => {
                    const rows = [];
                    for (let i = 0; i < pairs.length; i += 2) {
                        const left = pairs[i] || ['', ''];
                        const right = pairs[i + 1] || ['', ''];
                        rows.push([
                            String(left[0] || ''),
                            String(left[1] ?? '-'),
                            String(right[0] || ''),
                            String(right[1] ?? '-')
                        ]);
                    }
                    ensureSpace(18);
                    const colLabel = 32;
                    const colValue = (contentWidth - colLabel * 2) / 2;
                    doc.autoTable({
                        startY: yPos,
                        body: rows,
                        theme: 'grid',
                        styles: {
                            font: 'helvetica',
                            fontSize: 8.2,
                            cellPadding: { top: 3.2, bottom: 3.2, left: 3, right: 3 },
                            textColor: slate,
                            overflow: 'linebreak',
                            valign: 'middle',
                            lineColor: line,
                            lineWidth: 0.18,
                            minCellHeight: 9
                        },
                        columnStyles: {
                            0: { cellWidth: colLabel, fontStyle: 'bold', textColor: muted, fillColor: soft },
                            1: { cellWidth: colValue },
                            2: { cellWidth: colLabel, fontStyle: 'bold', textColor: muted, fillColor: soft },
                            3: { cellWidth: colValue }
                        },
                        margin: tableEdge,
                        tableWidth: contentWidth
                    });
                    yPos = doc.lastAutoTable.finalY + 7;
                };

                const drawKvTable = (pairs) => {
                    const body = pairs.map(([k, v]) => [String(k), String(v ?? '-')]);
                    ensureSpace(18);
                    doc.autoTable({
                        startY: yPos,
                        body,
                        theme: 'grid',
                        styles: {
                            font: 'helvetica',
                            fontSize: 8.4,
                            cellPadding: { top: 3.2, bottom: 3.2, left: 3.5, right: 3.5 },
                            textColor: slate,
                            overflow: 'linebreak',
                            valign: 'top',
                            lineColor: line,
                            lineWidth: 0.18,
                            minCellHeight: 9
                        },
                        columnStyles: {
                            0: {
                                cellWidth: 52,
                                fontStyle: 'bold',
                                textColor: muted,
                                fillColor: soft
                            },
                            1: { cellWidth: contentWidth - 52 }
                        },
                        margin: tableEdge,
                        tableWidth: contentWidth
                    });
                    yPos = doc.lastAutoTable.finalY + 7;
                };

                const drawAmrTable = (rows) => {
                    if (!rows.length) return;
                    ensureSpace(24);
                    doc.autoTable({
                        startY: yPos,
                        head: [['#', 'AMR ID', 'Status', 'P', 'W', 'Requirement']],
                        body: rows,
                        theme: 'grid',
                        styles: {
                            font: 'helvetica',
                            fontSize: 7.6,
                            cellPadding: { top: 2.6, bottom: 2.6, left: 2.2, right: 2.2 },
                            textColor: slate,
                            overflow: 'linebreak',
                            valign: 'top',
                            lineColor: line,
                            lineWidth: 0.14,
                            minCellHeight: 8
                        },
                        headStyles: {
                            fillColor: teal,
                            textColor: white,
                            fontStyle: 'bold',
                            fontSize: 7.8,
                            cellPadding: { top: 3, bottom: 3, left: 2.2, right: 2.2 }
                        },
                        alternateRowStyles: { fillColor: soft },
                        columnStyles: {
                            0: { cellWidth: 8, halign: 'center' },
                            1: { cellWidth: 24 },
                            2: { cellWidth: 28 },
                            3: { cellWidth: 8, halign: 'center' },
                            4: { cellWidth: 8, halign: 'center' },
                            5: { cellWidth: contentWidth - 76 }
                        },
                        margin: tableEdge,
                        tableWidth: contentWidth
                    });
                    yPos = doc.lastAutoTable.finalY + 7;
                };

                // Facility: full fields, readable on A4 (no truncation)
                const drawFacilityTable = (rows) => {
                    if (!rows.length) return;
                    ensureSpace(26);
                    doc.autoTable({
                        startY: yPos,
                        head: [['#', 'Facility', 'AMR / Requirement', 'Status', 'Details']],
                        body: rows,
                        theme: 'grid',
                        styles: {
                            font: 'helvetica',
                            fontSize: 7.4,
                            cellPadding: { top: 2.8, bottom: 2.8, left: 2.4, right: 2.4 },
                            textColor: slate,
                            overflow: 'linebreak',
                            valign: 'top',
                            lineColor: line,
                            lineWidth: 0.14,
                            minCellHeight: 10
                        },
                        headStyles: {
                            fillColor: teal,
                            textColor: white,
                            fontStyle: 'bold',
                            fontSize: 7.6,
                            cellPadding: { top: 3, bottom: 3, left: 2.4, right: 2.4 }
                        },
                        alternateRowStyles: { fillColor: soft },
                        columnStyles: {
                            0: { cellWidth: 8, halign: 'center' },
                            1: { cellWidth: 18 },
                            2: { cellWidth: 72 },
                            3: { cellWidth: 24 },
                            4: { cellWidth: contentWidth - 122 }
                        },
                        margin: tableEdge,
                        tableWidth: contentWidth
                    });
                    yPos = doc.lastAutoTable.finalY + 8;
                };

                const amrStatusOf = (step, amrId) => {
                    if (!step || !step.amrStatuses) return '-';
                    return step.amrStatuses[amrId] || step.amrStatuses[resolveAmrId(amrId)] || '-';
                };

                // ===== COVER =====
                updateProgress(10, 'Cover & identification...');
                doc.setFillColor(...teal);
                doc.rect(0, 0, pageWidth, 38, 'F');
                doc.setFillColor(...tealMid);
                doc.rect(0, 38, pageWidth, 1.4, 'F');

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(17);
                doc.setTextColor(...white);
                doc.text('DFA Comprehensive Report', pageWidth / 2, 15, { align: 'center' });
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(9);
                doc.text('Design Failure Analysis  |  A4 Professional Layout', pageWidth / 2, 23.5, { align: 'center' });
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.text(String(dfaData.dfaId || '-'), pageWidth / 2, 32, { align: 'center' });

                yPos = 48;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8.5);
                doc.setTextColor(...muted);
                doc.text(
                    `${(dfaData.selection?.type || 'DFA').toUpperCase()}  |  Generated ${new Date().toLocaleString()}`,
                    margin,
                    yPos
                );
                yPos += 9;

                // ===== 1. DETAILS (first) =====
                drawSectionBanner('1. DFA Details');
                drawKvGrid([
                    ['DFA Owner', detailSrc.dfaOwner || '-'],
                    ['Application Type', (dfaData.selection?.type || '-').toUpperCase()],
                    ['TC Number / Code', detailSrc.tcNumber || '-'],
                    ['TC Revision', detailSrc.tcRevisionNumber || '-'],
                    ['Part Name', detailSrc.tcDescription || '-'],
                    ['Part Revision', detailSrc.partRevision || '-'],
                    ['Platform', detailSrc.platform || '-'],
                    ['Platform ID', detailSrc.platformId || '-'],
                    ['Swimlanes', detailSrc.swimlanes || '-'],
                    ['Build Milestone', detailSrc.milestone || '-'],
                    ['Version', detailSrc.versionNumber || '-'],
                    ['Status', dfaData.metadata?.status || 'In Progress'],
                    ['Created', dfaData.metadata?.createdAt ? new Date(dfaData.metadata.createdAt).toLocaleDateString() : '-'],
                    ['Last Updated', dfaData.metadata?.lastUpdated ? new Date(dfaData.metadata.lastUpdated).toLocaleDateString() : '-']
                ]);

                // ===== 2. SUMMARY =====
                updateProgress(18, 'Summary...');
                drawSectionBanner('2. Summary');
                let facilitySections = 0;
                if (dfaData.facilityAnalysis?.length) {
                    facilitySections = new Set(dfaData.facilityAnalysis.map(i => i.sectionKey || i.stepKey)).size;
                }
                drawKvGrid([
                    ['Completed Steps', String(dfaData.metadata?.completedSteps?.length || 0)],
                    ['AMR Steps', String(dfaData.amr?.steps?.length || 0)],
                    ['PFD Steps', String(dfaData.pfd?.processSteps?.length || 0)],
                    ['Facility Sections', String(facilitySections)],
                    ['Facility Impact Items', String(dfaData.facilityAnalysis?.length || 0)],
                    ['Report Pages', 'See footer']
                ]);

                // ===== 3. PFD =====
                if (dfaData.pfd?.processSteps?.length) {
                    updateProgress(28, 'Process flow diagram...');
                    doc.addPage();
                    yPos = margin;
                    drawSectionBanner(`3. Process Flow Diagram  |  ${dfaData.pfd.processSteps.length} Steps`);

                    const maxImgW = contentWidth - 8;
                    const maxImgH = 68;

                    for (let i = 0; i < dfaData.pfd.processSteps.length; i++) {
                        const step = dfaData.pfd.processSteps[i];
                        updateProgress(28 + ((i + 1) / dfaData.pfd.processSteps.length) * 12, `PFD step ${i + 1}...`);

                        const dims = step.image ? await loadImageSize(step.image) : null;
                        const fitted = fitImageToWidth(dims?.w, dims?.h, maxImgW, maxImgH);
                        const stepName = String(step.name || step.stepName || '').trim() || `Step ${i + 1}`;
                        const titleLine = `Step ${i + 1}  |  ${stepName}`;
                        const titleLines = doc.splitTextToSize(titleLine, contentWidth - 14);
                        const descLines = doc.splitTextToSize(step.text || 'No description', contentWidth - 14);
                        const titleH = Math.max(titleLines.length * 4.6, 4.6);
                        const textH = Math.max(descLines.length * 4.2, 4.2);
                        const pad = 5.5;
                        const imgBlockH = step.image ? fitted.h : 10;
                        const blockH = pad + titleH + 3 + textH + 4 + imgBlockH + pad + 2;

                        if (yPos + Math.min(blockH, 40) > pageHeight - footerSafe) {
                            doc.addPage();
                            yPos = margin;
                        }
                        if (yPos + blockH > pageHeight - footerSafe) {
                            doc.addPage();
                            yPos = margin;
                        }

                        const cardY = yPos;
                        doc.setDrawColor(...line);
                        doc.setFillColor(...soft);
                        doc.setLineWidth(0.3);
                        doc.roundedRect(margin, cardY, contentWidth, blockH, 2, 2, 'FD');

                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(10);
                        doc.setTextColor(...teal);
                        doc.text(titleLines, margin + pad, cardY + 7.5);

                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(8.5);
                        doc.setTextColor(...slate);
                        doc.text(descLines, margin + pad, cardY + 7.5 + titleH + 1.5);

                        const imgY = cardY + 7.5 + titleH + 1.5 + textH + 2.5;
                        try {
                            if (step.image) {
                                const fmt = getImageFormat(step.image);
                                const xOff = margin + (contentWidth - fitted.w) / 2;
                                doc.addImage(step.image, fmt || 'JPEG', xOff, imgY, fitted.w, fitted.h, undefined, 'MEDIUM');
                            } else {
                                doc.setFontSize(8);
                                doc.setTextColor(...muted);
                                doc.text('No image for this step', margin + pad, imgY + 6);
                            }
                        } catch (imgError) {
                            console.warn('PFD image embed failed', i + 1, imgError);
                            doc.setFontSize(8);
                            doc.setTextColor(...muted);
                            doc.text('Image could not be embedded', margin + pad, imgY + 6);
                        }

                        yPos = cardY + blockH + 4;
                        if (i < dfaData.pfd.processSteps.length - 1) {
                            // Drawn connector (Helvetica has no ↓ / → glyphs → showed as !" )
                            const cx = pageWidth / 2;
                            const top = yPos;
                            doc.setDrawColor(...tealMid);
                            doc.setFillColor(...tealMid);
                            doc.setLineWidth(0.7);
                            doc.line(cx, top, cx, top + 5);
                            doc.triangle(cx - 2.2, top + 5, cx + 2.2, top + 5, cx, top + 8.2, 'F');
                            yPos = top + 12;
                            doc.setTextColor(...slate);
                        }
                    }
                }

                // ===== 4. AMR =====
                if (dfaData.amr?.steps?.length) {
                    updateProgress(45, 'AMR requirements...');
                    ensureSpace(26);
                    drawSectionBanner('4. AMR Requirements');

                    for (let i = 0; i < dfaData.amr.steps.length; i++) {
                        const step = dfaData.amr.steps[i];
                        updateProgress(45 + ((i + 1) / dfaData.amr.steps.length) * 20, `AMR step ${step.number}...`);

                        ensureSpace(30);
                        drawSubhead(`Step ${step.number}  |  ${(step.allSelectedAMRs || []).length} AMRs`);

                        if (step.commonPointsAMRs?.length) {
                            drawSubhead(`Common Points (${step.commonPointsAMRs.length})`);
                            const rows = step.commonPointsAMRs.map((amrId, idx) => {
                                const d = getAMRDetails(amrId);
                                return [
                                    String(idx + 1),
                                    d.id,
                                    amrStatusOf(step, d.id),
                                    String(d.priority || '-'),
                                    String(d.weightage || '-'),
                                    d.requirement || '-'
                                ];
                            });
                            drawAmrTable(rows);
                        }

                        (step.categorySections || []).forEach(section => {
                            if (!section.selectedAMRs?.length) return;
                            drawSubhead(`${getCategoryName(section.category)} (${section.selectedAMRs.length})`);
                            const rows = section.selectedAMRs.map((amrId, idx) => {
                                const d = getAMRDetails(amrId);
                                return [
                                    String(idx + 1),
                                    d.id,
                                    amrStatusOf(step, d.id),
                                    String(d.priority || '-'),
                                    String(d.weightage || '-'),
                                    d.requirement || '-'
                                ];
                            });
                            drawAmrTable(rows);
                        });
                    }
                }

                // ===== 5. FACILITY =====
                if (dfaData.facilityAnalysis?.length) {
                    updateProgress(70, 'Facility analysis...');
                    drawSectionBanner('5. Facility Analysis');

                    const sectionGroups = {};
                    dfaData.facilityAnalysis.forEach(item => {
                        const key = item.sectionKey || item.stepKey || `Step ${item.stepNumber || '?'}`;
                        if (!sectionGroups[key]) sectionGroups[key] = [];
                        sectionGroups[key].push(item);
                    });

                    const totalItems = dfaData.facilityAnalysis.length;
                    const passCount = dfaData.facilityAnalysis.filter(f => f.status === 'Pass').length;
                    const failCount = dfaData.facilityAnalysis.filter(f => f.status === 'Fail').length;
                    const partialCount = dfaData.facilityAnalysis.filter(f =>
                        f.status === 'Partially Passed' || f.status === 'Conditionally Passed'
                    ).length;

                    drawKvGrid([
                        ['Total Items', String(totalItems)],
                        ['Pass', String(passCount)],
                        ['Fail', String(failCount)],
                        ['Partially Passed', String(partialCount)],
                        ['Sections', String(Object.keys(sectionGroups).length)],
                        ['Applicable', 'Yes (facility impact)']
                    ]);

                    const sectionKeys = Object.keys(sectionGroups);
                    for (let s = 0; s < sectionKeys.length; s++) {
                        const sectionKey = sectionKeys[s];
                        const sectionItems = sectionGroups[sectionKey];
                        updateProgress(70 + ((s + 1) / sectionKeys.length) * 18, `Facility ${sectionKey}...`);

                        drawSubhead(`${sectionKey}  |  ${sectionItems.length} items`);
                        const rows = sectionItems.map((item, index) => {
                            const d = getAMRDetails(item.amrId);
                            const amrBlock = `${item.amrId || d.id}\n${d.requirement || '-'}`;
                            const details = [
                                `Tool: ${item.tool || '-'}`,
                                `Impact: ${item.impact || '-'}`,
                                `Machine CTQ: ${item.machineCTQ || '-'}`,
                                `Cost Impact: ${item.costImpact || '-'}`,
                                `Alignment F&T: ${item.alignmentFT || '-'}`
                            ].join('\n');
                            return [
                                String(index + 1),
                                item.facility || '-',
                                amrBlock,
                                item.status || '-',
                                details
                            ];
                        });
                        drawFacilityTable(rows);
                    }
                }

                // ===== 6. SCORE (last) =====
                updateProgress(92, 'DFA score...');
                ensureSpace(70);
                drawSectionBanner('6. DFA Score');

                if (scoreData) {
                    let accent = tealMid;
                    if (scoreData.overall >= 90) accent = [46, 125, 50];
                    else if (scoreData.overall >= 75) accent = [25, 118, 210];
                    else if (scoreData.overall >= 60) accent = [230, 126, 34];
                    else accent = [198, 40, 40];

                    ensureSpace(26);
                    doc.setDrawColor(...accent);
                    doc.setFillColor(...soft);
                    doc.setLineWidth(0.55);
                    doc.roundedRect(margin, yPos, contentWidth, 20, 1.8, 1.8, 'FD');
                    doc.setFillColor(...accent);
                    doc.roundedRect(margin, yPos, 3.2, 20, 1, 1, 'F');

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(15);
                    doc.setTextColor(...slate);
                    doc.text(`${scoreData.overall.toFixed(2)}%`, margin + 9, yPos + 9);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(9);
                    doc.setTextColor(...muted);
                    doc.text(String(scoreData.rating || ''), margin + 9, yPos + 15.5);
                    doc.setFontSize(8.5);
                    doc.text('Overall DFA Score', pageWidth - margin - 6, yPos + 11.5, { align: 'right' });
                    yPos += 26;

                    // ASCII-only formula card (Helvetica cannot render Sigma/minus/times/middot)
                    const formulaRows = [
                        ['Formula', 'Score % = 100 - (Sum of Penalties / Sum of Applicable x 100)'],
                        ['Rule value', 'Priority x Weightage'],
                        ['Fail', 'Full penalty (1.0 x rule value)'],
                        ['Conditionally / Partially Passed', 'Half penalty (0.5 x rule value)'],
                        ['Pass / N/A', 'No penalty'],
                        ['Applicable', 'Full AMR catalog']
                    ];
                    drawKvTable(formulaRows);

                    drawKvGrid([
                        ['Overall Score', `${scoreData.overall.toFixed(2)}%`],
                        ['Priority 5 Compliance', `${scoreData.priority5.toFixed(2)}%`],
                        ['Priority 3 Compliance', `${scoreData.priority3.toFixed(2)}%`],
                        ['Penalties / Applicable', `${scoreData.totalPenalties} / ${scoreData.totalApplicable}`],
                        ['Catalog / Flagged rules', `${scoreData.applicableCount || 0} / ${scoreData.failCount || (scoreData.failedItems || []).length}`],
                        ['Conditional / Partial', String(scoreData.conditionalCount || 0)]
                    ]);
                } else {
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(9);
                    doc.setTextColor(...muted);
                    doc.text('Score not available for this DFA.', margin, yPos);
                    yPos += 8;
                }

                // ===== FOOTER =====
                const totalPages = doc.internal.getNumberOfPages();
                for (let i = 1; i <= totalPages; i++) {
                    doc.setPage(i);
                    doc.setDrawColor(...line);
                    doc.setLineWidth(0.35);
                    doc.line(margin, pageHeight - 13, pageWidth - margin, pageHeight - 13);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(7.5);
                    doc.setTextColor(...muted);
                    doc.text(String(dfaData.dfaId || ''), margin, pageHeight - 8);
                    doc.text(`Page ${i} of ${totalPages}`, pageWidth / 2, pageHeight - 8, { align: 'center' });
                    doc.text('DFA WebApp | A4', pageWidth - margin, pageHeight - 8, { align: 'right' });
                }

                updateProgress(98, 'Saving PDF...');

                // Optional headless sample capture
                if (window.__DFA_PDF_RETURN_BASE64__) {
                    window.__DFA_PDF_BASE64__ = doc.output('datauristring');
                } else {
                    doc.save(`DFA-Report-${dfaData.dfaId}-${new Date().toISOString().split('T')[0]}.pdf`);
                }

                updateProgress(100, 'Complete!');
                setTimeout(() => {
                    hideProgress();
                    showSuccessMessage('✅ Clean A4 PDF generated successfully!');
                }, 400);

            } catch (error) {
                console.error('PDF Error:', error);
                alert('❌ Error generating PDF: ' + error.message);
                hideProgress();
            } finally {
                if (btn) {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            }
        }

        function checkPageBreak(doc, currentY, requiredSpace, margin, pageHeight, footerSafe = 20) {
            if (currentY + requiredSpace > pageHeight - footerSafe) {
                doc.addPage();
                return margin;
            }
            return currentY;
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const editBtn = document.getElementById('editBtn');
            const saveBtn = document.getElementById('saveBtn');
            const indicator = document.getElementById('editModeIndicator');

            if (isEditMode) {
                editBtn.classList.add('active');
                editBtn.innerHTML = '❌ Cancel Edit';
                saveBtn.style.display = 'inline-flex';
                indicator.classList.add('active');
                enableEditing();
            } else {
                editBtn.classList.remove('active');
                editBtn.innerHTML = '✏️ Edit Report';
                saveBtn.style.display = 'none';
                indicator.classList.remove('active');
                disableEditing();
                loadReportData();
            }
        }

        function enableEditing() {
            const editableItems = document.querySelectorAll('.info-item.editable');
            editableItems.forEach(item => {
                item.style.cursor = 'pointer';
                item.addEventListener('click', makeEditable);
            });
        }

        function disableEditing() {
            const editableItems = document.querySelectorAll('.info-item.editable');
            editableItems.forEach(item => {
                item.style.cursor = 'default';
                item.removeEventListener('click', makeEditable);
            });
        }

        function makeEditable(event) {
            if (!isEditMode) return;

            const item = event.currentTarget;
            const valueElement = item.querySelector('.info-value');
            const currentValue = valueElement.textContent.trim();
            const section = item.dataset.section;
            const field = item.dataset.field;

            if (valueElement.querySelector('input') || valueElement.querySelector('textarea')) return;

            const isLongText = currentValue.length > 50;
            const inputElement = isLongText ? document.createElement('textarea') : document.createElement('input');
            
            if (!isLongText) {
                inputElement.type = 'text';
            } else {
                inputElement.rows = 3;
            }
            
            inputElement.value = currentValue === 'Not specified' ? '' : currentValue;
            inputElement.dataset.section = section;
            inputElement.dataset.field = field;

            valueElement.innerHTML = '';
            valueElement.appendChild(inputElement);
            inputElement.focus();

            inputElement.addEventListener('blur', function() {
                valueElement.textContent = this.value || 'Not specified';
            });

            if (!isLongText) {
                inputElement.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        this.blur();
                    }
                });
            }
        }

        function saveChanges() {
            const editedInputs = document.querySelectorAll('.info-value input, .info-value textarea');
            
            editedInputs.forEach(input => {
                const section = input.dataset.section;
                const field = input.dataset.field;
                const value = input.value;

                if (dfaData[section]) {
                    dfaData[section][field] = value;
                }
            });

            dfaData.metadata.lastUpdated = new Date().toISOString();

            localStorage.setItem('currentDFA', JSON.stringify(dfaData));
            
            const allDFAs = JSON.parse(localStorage.getItem('allDFAData') || '{}');
            allDFAs[dfaData.dfaId] = dfaData;
            localStorage.setItem('allDFAData', JSON.stringify(allDFAs));

            showSuccessMessage('✓ Changes saved successfully!');
            toggleEditMode();
            loadReportData();
        }

        function showSuccessMessage(message = '✓ Changes saved successfully!') {
            const msgElement = document.getElementById('successMessage');
            msgElement.textContent = message;
            msgElement.classList.add('show');
            setTimeout(() => {
                msgElement.classList.remove('show');
            }, 3000);
        }

        function exportJSON() {
            const dataStr = JSON.stringify(dfaData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `dfa-complete-report-${dfaData.dfaId}.json`;
            link.click();
            
            setTimeout(() => URL.revokeObjectURL(url), 100);
            
            showSuccessMessage('✅ JSON exported successfully!');
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'e') {
                e.preventDefault();
                toggleEditMode();
            }
            if (e.ctrlKey && e.key === 's' && isEditMode) {
                e.preventDefault();
                saveChanges();
            }
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                generatePDF();
            }
        });
    </script>
</body>
</html>
